# H13-R3 (arm key `h13_dec_lang`) - R1 plus language decode.
#
# Copy of pi05_stage_h13_dec_finetune.yaml with ONE factor added: w_t must also name, in the frozen
# pi0.5 text-tower space, the subtask the robot is currently executing. Reading (c) of the campaign
# is R3 - R1 = the language marginal, so everything else is held byte-identical to R1.
#
# The captions are Qwen3-VL segment descriptions over the SAME frozen keyframes the keypatch labels
# use, so R1's decode head and R3's language head reference one temporal segmentation - that shared
# structure is what removes a confound from the R3 - R1 contrast.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_h13_dec_lang
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  # --- H13 live/joint WSM ---
  h13: true
  h13_jepa: false
  h13_w_dim: 512          # v1's hard bottleneck: ONE token per step, 512 dims
  h13_enc_layers: 4       # v1 encoder shape (n_layers 4, n_heads 8, mlp_ratio 4.0)
  h13_enc_heads: 8
  # lambda_dec. The tree permits exactly ONE canary-time adjustment of this number, and only on the
  # flow-fraction reading (< 70% after warmup); any change must be recorded in h13_build_status.md.
  h13_dec_weight: 0.5
  # Same sample-count-invariant Epps-Pulley statistic and same budget as the s3 arm, so the aux is
  # O(1) at init. (The pre-2026-07-31 un-normalized port made 0.05 act as ~20 and collapsed s3.)
  h13_sigreg_weight: 0.05
  labels_s3: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/wsm_labels
  # --- R3/R4 language decode ---
  # w_t is aligned to the FROZEN pi0.5 text-tower embedding of the caption for the segment this frame
  # sits in: InfoNCE-in-batch (normalised by ln B, so the term is O(1) at init and batch-size
  # invariant - the house rule every aux here follows) plus a cosine term, at lambda_lang 0.5.
  # Targets are PRECOMPUTED offline from the study pretrain checkpoint's own LLM and shipped as a
  # content-addressed asset; nothing is embedded on-node. The active segment is resolved from the
  # caption store's stored [t0, t1) intervals, never by searchsorted over `keyframes` (4.08% of
  # episodes have unsorted keyframes - see h13_build_status.md 5e).
  h13_lang: true
  h13_lang_weight: 0.5
  h13_lang_temperature: 0.07
  caption_emb_s3: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/studies/long_context_v1/artifacts/captions/b28f2de666606a37fde48dd0bd6a4599ef0a6d0a2660a990a5122a7caccd4215
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_h13_dec_lang
  output_dir: ckpts/vla_base/pi05_stage_h13_dec_lang_finetune

eval: null
