# ReMemBench arm rmb-base — the S0-shaped control for the 13-task ReMemBench finetune set.
#
# Same arm SHAPE as pi05_target_finetune.yaml / Stage-S s0: no workspace interface, no aux head,
# nothing read at inference. The ONLY differences from its RoboCasa counterpart are the data
# substrate and the step schedule:
#   * data.soup: remembench13 — a robocasa-FREE glob over the FLAT <Task>/<date>/lerobot export
#     (utils.soup.remembench_soup, base dir WSM_REMEMBENCH_ROOT). NO subsample block: all 323 train
#     demos across 13 tasks are used (filter_key None => native full mass, no seed-0 selection).
#   * 15k steps / 2.5k saves / 500 warmup / 25k decay — 323 demos is ~4% of the target50 mass, so
#     the 60k RoboCasa schedule would be many more epochs than the recipe intends.
# Everything else (lr, batch, cameras, ema, dtype, freeze surface, init) is byte-identical to the
# RoboCasa s0 recipe, so arm-to-arm comparisons stay clean.
#
# SUBMIT-TIME (not yaml fields): TARGET_DATA_S3 =
#   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/datasets/remembench_v02
# with target inventory artifact remembench_train13.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_base
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  # Experimental and deliberately OFF for sealed runs: this defers worker-side PIL resizing to the
  # batched JAX model graph. The implementations differ by up to one uint8 code on covered camera
  # shapes, so enabling it requires an explicit acceptance/canary decision.
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every demo (see utils/balancing.py from_data_view,
  # which rejects a subsample on this soup rather than silently ignoring it).
  # Single-source human split: nothing to balance.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path: submit_pi_stage_s.py sets WSM_FINAL_ONLY_CHECKPOINTS=1
  # + WSM_SAVE_INTERVAL=max_steps, _pi05_common forces save_interval=max_steps under that
  # flag, and the entry refuses any retained step dir other than 14999. One checkpoint ships.
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_base
  output_dir: ckpts/vla_base/pi05_rmb_base_finetune

eval: null
