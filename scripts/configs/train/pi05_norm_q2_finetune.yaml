# pi05_norm_q2_finetune.yaml — n-wave (norm-split replication) of pi05_stage_q_finetune.yaml.
#
# EXACT copy of the parent recipe plus ONE change: `data.norm_split_nav: true`, plus the
# distinguishing config_name/exp_name/output_dir the node entry needs so this run's checkpoint
# leaf never collides with the parent's. Same init, same data, same 60k schedule, same optimizer,
# same model knobs. The knob makes the action norm-stat merge pool the reordered base_motion dims
# 7,8,9 over the MOBILE datasets only (per-dataset std > 0.05 on that dim: 21/23/18 of the 50
# qualify on dim 7/8/9) instead of over all 50, un-squashing those dims' pooled std from
# 0.1768/0.1616/0.1219 to 0.2690/0.2369/0.2025 (x1.522 / x1.466 / x1.661). The floor selects
# mobile tasks, not merely non-degenerate ones — a 1e-3 floor admits incidental base jitter and
# recovers only ~1.15x.
# Dim 10 (torso) has std 0 in every task and falls back to the all-dataset value. Nothing else
# changes: other action dims, all state stats, quantiles, and the uniform merge weights are
# untouched (the uniform-vs-bal33 merge-weight question is deliberately NOT part of this wave).
regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_q_normsplit
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  # RoboTTT fast-weight geometry (shared across arms; canary axes per 7a). token_dim d, fast_hidden h,
  # num_registers N=16 (paper), inner base LR 0.1 (App A.1), gate init 1e-3 (Eq 3).
  robottt:
    token_dim: 256
    fast_hidden: 128
    num_registers: 16
    base_inner_lr: 0.1
    gate_init: 0.001
    window_len: 8      # L: contiguous chunk-steps per training sequence
    tbptt_segment: 8   # G: gradient truncation segment (G>=L => full BPTT over the window)
    # native-frame spacing between chunk-steps. 8 = the serve replan stride, so one training
    # chunk-step == one serve-time commit and the fast-weight cadence matches train->eval
    # (stride 1 would commit 8x denser at train than serve — audit 2026-07-23).
    chunk_stride: 8

data:
  norm_split_nav: true          # THE only recipe delta vs the parent
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  # Stage-Q batch_size counts WINDOWS (each L=8 chunk-steps): 8 windows -> effective per-step pi
  # batch 64, identical FLOPs/step and samples/step to the S0 recipe's batch 64.
  batch_size: 8
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_q_normsplit
  output_dir: ckpts/vla_base/pi05_stage_q_finetune_normsplit

eval: null
