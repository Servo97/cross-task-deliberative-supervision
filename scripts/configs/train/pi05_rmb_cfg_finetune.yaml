# ReMemBench arm rmb-cfg — the S2 current-only CFG read on the 13-task ReMemBench set.
#
# NO NEW MECHANISM. This is the sealed RoboCasa S2 recipe (arm `s2`, interface `cfg2`) with the
# ReMemBench data substrate and step schedule swapped in — the one cell of the Stage-S interface x
# benchmark grid that was simply never run on ReMemBench. Everything about the interface is inherited:
#
#   * WSMCurrentCfgConditioner fills the `wsm_cfg2_cond` subtree: adarms_cond += P(omega_t) versus a
#     LEARNED current-token null, zero-init readout, no future/omega_{t+1} slot,
#   * drop-to-null classifier-free-guidance dropout at p_drop = 0.2, per sample, train-only —
#     IDENTICAL to the sealed RoboCasa CFG arm. submit_pi_stage_s.py emits WSM_CFG_P_DROP=0.2 and
#     manifest.training.cfg_drop_probability=0.2 for `--arm s2`; neither is a yaml field here, which
#     is exactly what keeps this arm from drifting away from its RoboCasa twin,
#   * cond_window stays at the S2 default of 1 (the read is current-only; the window sweep is the
#     deltanet axis, not this one),
#   * eval guidance scale is a per-serve-process choice (serve_pi_05_wsm_cfg.py --guidance-scale),
#     never a train-time field.
#
# The ONLY differences from the RoboCasa s2 arm are the data substrate and the step schedule (see
# pi05_rmb_base_finetune.yaml), matching how pi05_rmb_tanh_finetune.yaml relates to the s1 arm.
#
# LAUNCH: --arm s2 --config-override scripts/configs/train/pi05_rmb_cfg_finetune.yaml
#         --dataset-profile remembench_v02_train13 --train-steps 15000
#
# SUBMIT-TIME (not yaml fields): TARGET_DATA_S3 =
#   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/datasets/remembench_v02
# with target inventory artifact remembench_train13.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_cfg
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  # cond_type/cond_window are deliberately ABSENT: they select the module behind the tanh subtree and
  # are meaningless for the cfg2 interface, which the entry selects via PI_STAGE_S_INTERFACE=cfg2.
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every demo.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path: submit_pi_stage_s.py sets WSM_FINAL_ONLY_CHECKPOINTS=1
  # + WSM_SAVE_INTERVAL=max_steps, _pi05_common forces save_interval=max_steps under that flag,
  # and the entry refuses any retained step dir other than 14999. One checkpoint ships.
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_cfg
  output_dir: ckpts/vla_base/pi05_rmb_cfg_finetune

eval: null
