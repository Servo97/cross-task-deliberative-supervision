# Stage-S S1 with the gated-DeltaNet steering conditioner (pi05_workspace_finetune.yaml + one change).
#
# The ONLY recipe difference from the shipped S1 tanh arm is the module behind the wsm_tanh_cond
# subtree: `cond_type: gated_deltanet` replaces tanh(alpha)*MLP(omega_t) with a stateless gated
# delta-rule recurrence across the `cond_window` most recent omega latents, read out at the newest
# position and gated by the identical tanh(alpha) seam (alpha=1e-3, so step 0 is the S0 policy).
# Nothing carries across policy calls — this is the steering axis, not the RoboTTT fast-weight axis.
# cond_window: 16 raises the loader window from the S1 default of 1; _pi05_common exports it as
# WSM_K_WINDOW BEFORE the openpi imports (the dataloader freezes that variable at import) and fails
# loudly if the loader and the conditioner disagree. Everything else — init, data, freeze surface,
# optimizer, 60k schedule, interface/arm label (s1/tanh) — is byte-identical to the tanh arm.
#
# SERVE AUTO-DETECT CONTRACT: the sealed eval submit command gains NO new flags. serve_pi_05_wsm_cfg
# peeks the checkpoint's params metadata before building the model: `pos_decay_bias` (present only in
# the deltanet tree) selects the variant and its leading axis IS cond_window, its trailing axis the
# head count, and proj_q's kernel gives head_dim. The per-env online conditioner is then constructed
# at that window, so a ckpt trained at 8 can never be served at 1. WSM_COND_TYPE overrides the
# detection and must agree with the tree, otherwise the server refuses to start.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_s1_deltanet_w16
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cond_type: gated_deltanet
  cond_window: 16
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  # Experimental and deliberately OFF for sealed Stage-S runs: this defers worker-side PIL
  # resizing to the batched JAX model graph. The implementations differ by up to one uint8 code
  # on covered camera shapes, so enabling it requires an explicit acceptance/canary decision.
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_s1_deltanet_w16
  output_dir: ckpts/vla_base/pi05_stage_s1_deltanet_w16_finetune

eval: null
