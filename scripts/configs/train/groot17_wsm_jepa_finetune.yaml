# groot17_wsm_jepa_finetune.yaml — MODEL-FREE WSM GR00T N1.7 target finetune (doc 12).
#
# IDENTICAL to groot17_target_finetune.yaml / groot17_wsm_canary_finetune.yaml (same init-from the
# bal33@150k pretrain, same combined target soup, seed-0 30% subsample, freeze projector+DiT, same
# optim/batch/steps) EXCEPT: instead of injecting w_t via a TokenModulator, it adds a JEPA+SIGReg AUX
# LOSS at the action head's penultimate layer, aligning it to the next workspace latent w_{t+1}. w is a
# TRAINING TARGET ONLY (never in the inference graph) => no eval-OOD failure mode.
#
# The wsm: block is provenance; the driver reads WSM_POLICY_FEATS_ROOT / WSM_JEPA_WEIGHT /
# WSM_SIGREG_WEIGHT / WSM_JEPA_DIRECT / WSM_W_DIM from the env. See finetune_groot_17_with_wsm_jepa.py.

regime: vla_base
backbone: groot_n17
phase: target_finetune

model:
  base_model: nvidia/GR00T-N1.7-3B
  embodiment_tag: NEW_EMBODIMENT
  action_horizon: 16
  state_dropout_prob: 0.2
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  freeze:
    tune_llm: false
    tune_visual: false
    tune_projector: true
    tune_diffusion_model: true
  normalization:
    continuous: min_max
    gripper_close: binary
    control_mode: binary
    state_rotation: rotation_6d

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false
  augmentation:
    video_crop_scale: 0.95
    resize: 224
    color_jitter:
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08

# Model-free WSM aux (provenance; the driver reads the env vars of the same meaning).
wsm:
  mode: jepa                  # vs the injection canary's modulator
  enabled: true
  w_dim: 512                  # WorkspaceEncoder latent dim (WSM_W_DIM)
  jepa_weight: 1.0            # lambda on (1 - cos(predictor(penult), w_next))  (WSM_JEPA_WEIGHT)
  sigreg_weight: 0.05         # lambda on Epps-Pulley SIGReg(penult)            (WSM_SIGREG_WEIGHT)
  jepa_direct: false          # true = no predictor MLP (penult IS the prediction) (WSM_JEPA_DIRECT)
  target: w_next              # next grid-frame latent (~1 control cycle ahead) = "the t+1 workspace token"
  # encoder selection: use the DECODE-metric winner (orig_65k: hit@1 0.39/IoU 0.167), NOT the probe
  # winner (v2_50k) — input_norm boosted task-sep but degraded the spatial saliency conditioning needs.
  feats_root: /opt/ml/work/wsm_policy_feats
  encoder_ckpt: s3://sagemaker-us-west-2-124224456861/sarvesh.patil/wsm_robocasa/wsm_runs/groot_wsm_base/wsm_step65000.pt
  policy_feats_s3: s3://sagemaker-us-west-2-124224456861/sarvesh.patil/wsm_robocasa/wsm_policy_feats/groot_step65000

optim:
  lr: 3.0e-5
  optimizer: adamw
  betas: [0.95, 0.999]
  weight_decay: 1.0e-5
  lr_schedule: cosine
  warmup_ratio: 0.05
  dtype: bf16

train:
  batch_size: 128
  max_steps: 60000
  save_interval: 5000
  num_workers: 8          # per DDP rank = 64 workers/node on 8-GPU p5.48xlarge
  init_from: s3://sagemaker-us-west-2-124224456861/sarvesh.patil/wsm_robocasa/pretrain150k/groot/mg60_bal33/groot-mg60-bal33/checkpoint-150000
  exp_name: groot17_rc365_wsm_jepa
  output_dir: ckpts/vla_base/groot17_wsm_jepa   # LOCAL ONLY (gitignored)

eval: null
