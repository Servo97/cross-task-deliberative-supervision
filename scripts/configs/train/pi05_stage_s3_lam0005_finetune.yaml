# Stage-S3 lambda-sigreg sweep arm (arm name: s3-lam0005). Copy of pi05_stage_s3_jepa_finetune.yaml
# with ONE change: lambda_sigreg 0.05 -> 0.005, a 10x smaller isotropy budget on the action-expert
# penultimate. Everything else — init, target50 T30 data, full-finetune surface, optimizer, 60k
# schedule, lambda_jepa=1.0, the train-time-only omega target, the byte-identical-to-S0 eval — is the
# s3 recipe unchanged. The point of the arm: 0.05 was ported from the torch WSM trainer's --lam-sig,
# never tuned here, and the s3 collapse forensics only established that the term must be
# SAMPLE-COUNT-INVARIANT, not that 0.05 is the right size once it is. This is the cheap lower-bracket
# probe; k stays at the default 1 future.
#
# Launch: same entry as s3 (STAGE_S_INTERFACE=jepa, --interface jepa); point WSM_FT_CONFIG at this
# file. Interface, loader contract (wsm_w_target) and checkpoint tree are identical to s3.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_s3_lam0005
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  # --- the one recipe difference vs pi05_stage_s3_jepa_finetune.yaml ---
  sigreg_weight: 0.005        # lambda on the SIGReg statistic (the s3
                              # default is 0.05; env override WSM_SIGREG_WEIGHT).
                              # lambda_jepa stays 1.0.
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_s3_lam0005
  output_dir: ckpts/vla_base/pi05_stage_s3_lam0005_finetune

eval: null
