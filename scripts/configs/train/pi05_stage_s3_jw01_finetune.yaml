# Stage-S3 lambda-JEPA sweep arm (arm name: s3-jw01). Copy of pi05_stage_s3_jepa_finetune.yaml with
# ONE change: lambda_jepa 1.0 -> 0.1 (sigreg stays at the s3 default 0.05). Motivation, from the
# 2026-08-01 sealed discriminators: regularizer SHAPE is exonerated (VISReg 42.8 ~= SIGReg 42.3) and
# the regularizer WEIGHT is nearly flat (sigreg 0.005 -> 44.5 vs 0.05 -> 42.3, vs no-aux 55.8), so
# the ~11-13pt cost must sit in the (1-cos) prediction term itself — whose weight was 1.0 in every
# run so far and never swept. This arm is that missing dose point. If 0.1 recovers toward 55.8 the
# harm is proportional pressure from the prediction objective; if it stays ~44 the mere presence of
# the target-coupled gradient direction is the problem.
#
# Launch: same entry as s3 (STAGE_S_INTERFACE=jepa, --interface jepa); point WSM_FT_CONFIG at this
# file. Interface, loader contract (wsm_w_target) and checkpoint tree are identical to s3.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_s3_jw01
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  # --- the one recipe difference vs pi05_stage_s3_jepa_finetune.yaml ---
  jepa_weight: 0.1            # lambda on the (1-cos) prediction term (s3 default 1.0;
                              # env override WSM_JEPA_WEIGHT). sigreg stays at 0.05.
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_s3_jw01
  output_dir: ckpts/vla_base/pi05_stage_s3_jw01_finetune

eval: null
