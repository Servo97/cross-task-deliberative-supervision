# ReMemBench arm rmb-causal — deliberative supervision on CAUSAL patches instead of SALIENT ones.
#
# The existing deliberative-supervision arm (pi05_stage_s3_salient / pi05_norm_s3_salient) trains a
# 192-way BCE head on next-keyframe SALIENT patches: VLM-named objects that are "involved" in the
# subgoal — the manipulated object, but ALSO the gripper, the arm, and task effects (running water,
# flame, steam). Measured neutral-to-negative on RoboCasa.
#
# Causal-confusion framing (de Haan, Jaeger & Levine 2019) says the distinction that matters is
# CAUSAL relevance, not salience: a policy that attends to whatever co-varies with the expert action
# learns the confounder. So this arm supervises "what must the action causally touch" — the
# manipulated object and its goal slot (receptacle / appliance / counter region) — and NOTHING else.
# Labels are the causal_v1 spec (workspace_models/labels/qwen_subgoals.py --spec causal_v1): same
# Qwen->Molmo->patch pipeline, same 192-dim binary next-keyframe mask, sparser support by
# construction (2 entities/subgoal, no embodiment, no effects).
#
# DELTA vs pi05_rmb_base_finetune.yaml: the three `salient`/`labels_s3` lines plus the two zeroed
# jepa terms the arm rides on. Data, schedule, optimizer, init and every model knob are otherwise
# byte-identical, so rmb-base is this arm's matched control and rmb-causal vs the RoboCasa salient
# arms is the salience-vs-causality contrast.
#
# The arm rides the JEPA interface (--arm s3): both jepa terms are still CONSTRUCTED but held at
# exactly 0.0, contributing nothing to the loss or its gradient — identical to how the RoboCasa
# salient arm is wired. The salient aux head is the only live auxiliary term.
#
# SUBMIT-TIME (not yaml fields): TARGET_DATA_S3 =
#   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/datasets/remembench_v02
# with target inventory artifact remembench_train13, --dataset-profile remembench_v02_train13,
# --arm s3 --config-override scripts/configs/train/pi05_rmb_causal_finetune.yaml, and the same
# encoder_id / omega / prompt-manifest triple the rmb-jw01k16 arm sealed (the s3 launch path stages
# the omega cache whether or not the recipe reads it).

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_causal
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  # The jepa aux this arm replaces, held at exactly zero (see header).
  jepa_weight: 0.0
  sigreg_weight: 0.0
  # The deliberative-supervision aux itself, pointed at the CAUSAL label store. The npz schema,
  # filename (vlm_episode_pi_%06d.npz) and 192-patch geometry are identical to the salient store,
  # so the aux head and the dataset loader need zero code change — only the root moves.
  salient: true
  salient_weight: 1.0
  labels_s3: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/wsm_labels_causal_v1/remembench13
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every one of the 323 demos (filter_key None).
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path (WSM_FINAL_ONLY_CHECKPOINTS=1 forces one ckpt at 14999).
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_causal
  output_dir: ckpts/vla_base/pi05_rmb_causal_finetune

eval: null
