# pi05_wsm_cfg_finetune.yaml — Phase-2 pi-0.5 target finetune WITH WSM-CFG conditioning (doc 12).
#
# Identical operating point to pi05_target_finetune.yaml (combined-30% target soup, init from the Phase-1
# pretrain ckpt, freeze none = FULL finetune) EXCEPT a zero-init WSMCfgConditioner is added: it turns the
# workspace latent w_t into an ADDITIVE vector on the action expert's adaRMS driver (adarms_cond), trained
# with per-component CFG dropout to a learned null. The VLM/perception backbone is NEVER touched. At init
# cond==0 so the policy is byte-identical to the baseline finetune -> any Eval2 delta is attributable to w_t.
#
# The CFG path is gated at RUNTIME by env (NOT yaml fields), set by finetune_pi_05_with_wsm_cfg.py / the
# SageMaker entry:
#   WSM_POLICY_FEATS_ROOT  -> the precomputed pi w_t dir (also gates the dataset's wsm_w_window injection)
#   WSM_CFG=1              -> select CFG over the legacy image-token injection
#   WSM_CFG_P_DROP=0.2     -> per-component CFG dropout
#   WSM_CFG_WITH_FUTURE=0  -> POC: w_{t+1} slot stays the null (demo-ICL flips this on later)
# Eval guidance scale is set per-serve-process (serve_pi_05_wsm_cfg.py --guidance-scale), never here.
#
# Schema (shared across all train/eval configs): model / data / optim / train / eval.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_wsm_cfg_ft
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none                              # FULL finetune (== baseline) + the net-new zero-init conditioner
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000                          # POC overrides via WSM_MAX_STEPS / WSM_SAVE_INTERVAL
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-124224456861/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_wsm_cfg_ft
  output_dir: ckpts/vla_base/pi05_wsm_cfg_finetune

eval: null                   # eval is a separate phase — serve_pi_05_wsm_cfg.py + configs/eval/pi05_eval.yaml
