# ReMemBench arm rmb-deltanet-drop — the w8 DeltaNet arm PLUS history-intervention dropout 0.5.
#
# WHY. The ReMemBench window curve DECLINES with window (w2 37.5 > w8 36.8 > w16 35.8 > w32 32.7 ~
# base 31.3). Under de Haan et al.'s causal-confusion account of imitation learning, a longer history
# supplies more spurious correlates of the demonstrator's action, and the recurrence latches onto them
# instead of the causal state. That account makes a sharp, cheap prediction: intervening on the
# history (deleting historical elements at random during training) breaks the correlate and RESCUES
# the long-window arms. A capacity/optimization account predicts the intervention does nothing.
#
# THE KNOB. model.cond_history_dropout = 0.5: on every TRAINING step, each element of the omega window
# is deleted independently per sample with probability 0.5, EXCEPT the newest (current-timestep)
# element, which is never deleted — the arm must read "less history", never "no current observation".
# A deleted element is skipped in the delta-rule recurrence exactly as if it had never been in the
# window (no decay, no update), not replaced by a pad embedding. Nothing is ever deleted at serve, so
# the eval contract is unchanged. The knob adds NO parameters, so the checkpoint tree — and hence
# serve's `pos_decay_bias` window auto-detection — is identical to the parent arm.
#
# Identical to `pi05_rmb_deltanet_finetune.yaml` (cond_window 8, interface tanh, alpha=1e-3 seam, 15k
# steps, 13-task set) EXCEPT model.cond_history_dropout. This is the w8 CONTROL of the dropout wave:
# w8 already sits near the top of the curve, so it bounds how much of any w16/w32 rescue is the
# intervention itself rather than a window effect.
#
# submit_pi_stage_s.py reads BOTH model.cond_window and model.cond_history_dropout out of this file
# and seals them into the run manifest (training.workspace_window / training.cond_history_dropout)
# and the job environment (WSM_K_WINDOW / WSM_COND_HISTORY_DROPOUT).
#
# SUBMIT-TIME (not yaml fields): TARGET_DATA_S3 =
#   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/datasets/remembench_v02
# with target inventory artifact remembench_train13.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_deltanet_drop
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cond_type: gated_deltanet
  cond_window: 8
  cond_history_dropout: 0.5    # train-only; newest window element is never dropped
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every demo.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path: submit_pi_stage_s.py sets WSM_FINAL_ONLY_CHECKPOINTS=1
  # + WSM_SAVE_INTERVAL=max_steps, _pi05_common forces save_interval=max_steps under that flag,
  # and the entry refuses any retained step dir other than 14999. One checkpoint ships.
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_deltanet_drop
  output_dir: ckpts/vla_base/pi05_rmb_deltanet_drop_finetune

eval: null
