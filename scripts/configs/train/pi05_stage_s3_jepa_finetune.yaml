# Stage-S3 pi0.5 JEPA+SigReg recipe (packet 08): train-time-only aux target, NOTHING at inference.
#
# Selected through finetune_pi_05_with_workspace.py --interface jepa. Identical H300+MG init,
# target50 T30 data, full-finetune surface, optimizer, and 60k schedule as S0/S1/S2; the ONLY
# difference is the aux loss lambda_jepa*(1-cos) + lambda_sigreg*EppsPulley at the action expert's
# penultimate, targeting the frozen next-grid omega (stop-gradient). Lambdas are the groot
# prototype's (1.0 / 0.05) — ported, not tuned. Eval is byte-identical to S0 (no conditioner, no
# extra inputs; the wsm_jepa_head is unused at inference).

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_s3_jepa
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_s3_jepa
  output_dir: ckpts/vla_base/pi05_stage_s3_jepa_finetune

eval: null
