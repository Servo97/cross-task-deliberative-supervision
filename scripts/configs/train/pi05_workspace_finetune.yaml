# Shared Stage-S pi0.5 workspace-read recipe (S1 tanh / S2 current-only CFG2).
#
# Select exactly one runtime interface through finetune_pi_05_with_workspace.py. Both arms use the
# same H300+MG initialization, target50 T30 data, full-finetune surface, optimizer, and 60k schedule.
# Neither arm modifies VLM/prefix tokens. CFG2 has only P_t/null_t; tanh has no null/dropout.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_workspace_stage_s
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  # Experimental and deliberately OFF for sealed Stage-S runs: this defers worker-side PIL
  # resizing to the batched JAX model graph. The implementations differ by up to one uint8 code
  # on covered camera shapes, so enabling it requires an explicit acceptance/canary decision.
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_workspace_stage_s
  output_dir: ckpts/vla_base/pi05_workspace_finetune

eval: null
