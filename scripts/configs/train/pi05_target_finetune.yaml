# pi05_target_finetune.yaml — Phase-2 pi-0.5 base-VLA target-task finetune.
# Governed by internal_planning_and_todos/01_robocasa_protocol_and_recipes.md
#   "Phase 2 — Target-task finetune".
#
# OFFICIAL RoboCasa recipe (doc 01): finetune on the 50 target tasks (human demos,
#   `target` split), ~60k steps, starting from the phase-1 pretrain checkpoint.
#   NOTE: composite_unseen tasks are FIRST INTRODUCED here. Model / freeze (none) /
#   augmentation are identical to the pretrain phase. Runs on the openpi jax-latest fork.
#   Base-VLA training (NOT a workspace model) — see README naming discipline.
#
# Schema (shared across all train/eval configs): model / data / optim / train / eval.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_target_ft
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true       # always-on aug inside preprocess_observation
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  # Combined target finetune: ONE run over all 50 target tasks (atomic_seen 18 +
  # composite_seen 16 + composite_unseen 16), human demos only. composite_unseen first
  # appears here. Eval is still broken out per-subcategory (see configs/eval/pi05_eval.yaml).
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  # Experimental and deliberately OFF for sealed Stage-S runs: this defers worker-side PIL
  # resizing to the batched JAX model graph. The implementations differ by up to one uint8 code
  # on covered camera shapes, so enabling it requires an explicit acceptance/canary decision.
  defer_image_resize_to_model_preprocess: false
  # Resource-saving combined-30%: finetune on 30% of EACH subcategory's demos (500 -> 150/task).
  # pi0.5 realizes this natively via each ds_meta's filter_key='150_demos' (seed 0). GR00T mirrors
  # the SAME deterministic selection (utils.subsample) so both backbones see identical episodes.
  subsample:
    target_fraction: 0.30
  # Single-source human target split: nothing to balance.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  # Phase-2 inits from the phase-1 pretrain checkpoint. Canonical = the BALANCED (bal33) @150k
  # pretrain ckpt (orbax `params` leaf). On SageMaker the FT entry syncs this S3 path to a local
  # dir and passes it via WSM_INIT_FROM (orbax can't read s3://); this value is the provenance
  # record + the local-run fallback.
  init_from: s3://sagemaker-us-west-2-124224456861/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null                    # weights come from init_from, not the base params
  exp_name: pi05_rc365_target_ft
  output_dir: ckpts/vla_base/pi05_target_finetune   # LOCAL ONLY (gitignored)

eval: null                   # eval is a separate phase — see configs/eval/pi05_eval.yaml
