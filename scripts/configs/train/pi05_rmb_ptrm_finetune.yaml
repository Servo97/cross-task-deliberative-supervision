# pi05_rmb_ptrm_finetune.yaml — H9 parked stronger-variant discharge: PTRM on the memory benchmark.
#
# EXACT copy of pi05_rmb_deltanet_finetune.yaml plus the PTRM head (cond_type gated_deltanet_ptrm,
# T=4, q_weight 0.1 — identical knobs to the sealed RoboCasa arm s1-94b215496fe2ec2e). On RoboCasa
# the PTRM triple was a clean negative (E1 approx E2 approx E0 - 1.2; verifier non-functional; see
# eval_results_final.md PTRM section). ReMemBench is the one context where the paper's own
# demand-scaling line predicts test-time width scaling COULD pay: the deltanet read carries real
# signal here (+5.5). Same eval ladder applies at box tier: E0 K1s0 / E1 best-Q / E2 random.
regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_ptrm
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cond_type: gated_deltanet_ptrm   # THE recipe delta vs the rmb deltanet parent
  cond_window: 8
  ptrm_steps: 4
  ptrm_q_weight: 0.1
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every demo.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path: submit_pi_stage_s.py sets WSM_FINAL_ONLY_CHECKPOINTS=1
  # + WSM_SAVE_INTERVAL=max_steps, _pi05_common forces save_interval=max_steps under that
  # flag, and the entry refuses any retained step dir other than 14999. One checkpoint ships.
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_ptrm
  output_dir: ckpts/vla_base/pi05_rmb_ptrm_finetune

eval: null
