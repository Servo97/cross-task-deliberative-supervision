# ReMemBench arm rmb-jw01k16 — the S3 JEPA+SigReg combo cell on the 13-task ReMemBench set.
#
# Recipe = pi05_stage_s3_jw01k16_finetune.yaml (interface jepa): a TRAIN-TIME-ONLY aux target,
# nothing read at inference (eval is byte-identical to the base arm). The aux is
# jepa_weight*(1-cos) + sigreg_weight*EppsPulley at the action expert's penultimate, targeting the
# frozen next-grid omega (stop-gradient), with jepa_weight 0.1 and jepa_num_futures 16 — the two
# axes that independently crossed baseline on RoboCasa, combined. sigreg stays at its 0.05 default.
#
# The ONLY differences from the RoboCasa s3-jw01k16 arm are the data substrate and the step schedule
# (see pi05_rmb_base_finetune.yaml).
#
# SUBMIT-TIME (not yaml fields): TARGET_DATA_S3 =
#   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/datasets/remembench_v02
# with target inventory artifact remembench_train13.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_jw01k16
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  jepa_weight: 0.1            # lambda on the (1-cos) prediction term (s3 default 1.0)
  jepa_num_futures: 16        # grid rows +1..+16
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every demo.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path: submit_pi_stage_s.py sets WSM_FINAL_ONLY_CHECKPOINTS=1
  # + WSM_SAVE_INTERVAL=max_steps, _pi05_common forces save_interval=max_steps under that
  # flag, and the entry refuses any retained step dir other than 14999. One checkpoint ships.
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_jw01k16
  output_dir: ckpts/vla_base/pi05_rmb_jw01k16_finetune

eval: null
