# pi05_norm_s1_ptrm_finetune.yaml — PTRM (H9) arm of the n-wave, cloned from
# pi05_norm_s1_deltanet_finetune.yaml.
#
# EXACT copy of that recipe — same init, same target50 data, same 60k schedule, same optimizer, same
# `data.norm_split_nav: true`, same `cond_window: 8` — plus ONE change: the module behind the
# `wsm_tanh_cond` subtree becomes the PTRM conditioner (`cond_type: gated_deltanet_ptrm`), which wraps
# the identical gated delta-rule read in a weight-tied 4-step recursive core and a Q head trained to
# predict the realized log flow loss (`ptrm_q_weight: 0.1`). That is the whole train-time delta, and
# it is deliberately the only one: the paper's actual procedure — K noisy rollouts with argmin-Q
# selection — is INFERENCE-ONLY and is applied to this checkpoint at eval time, so a comparison
# against the deltanet w=8 parent isolates the cost of TRM-ifying the read (E0) before any width
# scaling is claimed (E1). The arm carries no history-intervention dropout and no jepa/salient aux;
# both are refused by the launcher and the model config rather than left to the recipe.
# The distinguishing config_name/exp_name/output_dir keep this run's checkpoint leaf from colliding
# with the parent's.
regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_s1_ptrm_normsplit
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cond_type: gated_deltanet_ptrm   # THE only recipe delta vs the deltanet w=8 parent
  cond_window: 8
  ptrm_steps: 4                    # recursion depth T; also step_bias's leading axis in the ckpt
  ptrm_q_weight: 0.1               # lambda on huber(q_{t_i}, stopgrad(log mean_H flow_loss))
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  norm_split_nav: true
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  # Experimental and deliberately OFF for sealed Stage-S runs: this defers worker-side PIL
  # resizing to the batched JAX model graph. The implementations differ by up to one uint8 code
  # on covered camera shapes, so enabling it requires an explicit acceptance/canary decision.
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_s1_ptrm_normsplit
  output_dir: ckpts/vla_base/pi05_stage_s1_ptrm_finetune_normsplit

eval: null
