# groot17_pretrain.yaml — Phase-1 GR00T N1.7 base-VLA pretrain on RoboCasa365.
# Governed by internal_planning_and_todos/01_robocasa_protocol_and_recipes.md
#   "The benchmark protocol (official)" + "GR00T recipe (the proven 43% recipe)".
#
# OFFICIAL RoboCasa recipe (doc 01): pretrain on pretrain_human300_mg60
#   (registry source="all" = human 482h/300 tasks + MimicGen 1615h/60 atomic = 2000+h),
#   ~80k steps, batch 128. Freeze LLM + vision tower; train projector + DiT head only.
#   This is base-VLA training (NOT a workspace model) — see README naming discipline.
#
# Schema (shared across all train/eval configs): model / data / optim / train / eval.

regime: vla_base            # base VLA — no workspace-model head. (README: vla_base/train_base)
backbone: groot_n17
phase: pretrain

model:
  base_model: nvidia/GR00T-N1.7-3B   # Cosmos-Reason2-2B backbone (gated; see doc 01 caveat)
  embodiment_tag: NEW_EMBODIMENT
  # Modality / action-config mirrors ported_raw/.../robocasa_panda_modality.py.
  action_horizon: 16                 # action_indices = range(16) (N1.5 proven; was 8 in R0-v1)
  state_dropout_prob: 0.2            # N1.7 default
  cameras:                           # 3 cams @ 224x224 (doc 01 obs spec)
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  # Freeze schedule — the 43% recipe: train projector + DiT only, no LoRA.
  freeze:
    tune_llm: false
    tune_visual: false
    tune_projector: true
    tune_diffusion_model: true
  # Per-key normalization (doc 01). N1.7 CAVEAT: N1.7 cannot natively express `binary`
  # norm or `rotation_6d` — it uses a global-percentile min_max. The closest faithful
  # match is the ABSOLUTE/NON_EEF action_configs + min_max in robocasa_panda_modality.py
  # (OSC deltas treated as-is; use_relative_action is a no-op when no key is RELATIVE).
  # The values below document the INTENT; the loader maps them onto N1.7's min_max.
  normalization:
    continuous: min_max              # eef pos/rot, base_motion
    gripper_close: binary            # -> min_max under N1.7
    control_mode: binary             # -> min_max under N1.7
    state_rotation: rotation_6d      # -> percentile min_max under N1.7

data:
  # Dataset soup: human + MimicGen pretrain mix (registry source="all").
  soup: pretrain_human300_mg60
  source: all
  split: pretrain
  # --- Data balancing lever (the balancing-ON pretrain arm) --------------------------
  # Target an even per-batch source mix ~ 1/3 mg-atomic : 1/3 human-atomic : 1/3 human-composite
  # (equal per-source weights + no cap => equal thirds in expectation). Hypothesis: this lifts the
  # composite / composite_unseen columns vs MimicGen-dominated batches. Realized only in
  # expectation: GR00T applies it as one SingleDatasetConfig per group with mix_ratio = 1/3
  # (utils.balancing.groot_group_specs). For the balancing-OFF arm set enabled:false (GR00T's
  # native single-spec size-proportional mixing).
  data_balancing:
    enabled: true
    mg_atomic_weight: 1.0
    human_atomic_weight: 1.0
    human_composite_weight: 1.0
    max_mg_atomic_fraction: 1.0      # 1.0 = no cap; with equal weights => 33/33/33
    strategy: per_batch_resample     # per_batch_resample | source_weighted | none
  # Video augmentation (doc 01): VideoCrop scale 0.95, resize 224, ColorJitter b/c/s/h.
  augmentation:
    video_crop_scale: 0.95
    resize: 224
    color_jitter:
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08

optim:
  lr: 3.0e-5                 # the 43% recipe LR (N1.7 default is 1e-4 — intentionally lower)
  optimizer: adamw
  betas: [0.95, 0.999]
  weight_decay: 1.0e-5
  lr_schedule: cosine
  warmup_ratio: 0.05
  dtype: bf16

train:
  batch_size: 128
  max_steps: 150000                      # run length (user: both backbones to 150k)
  save_interval: 20000                   # ckpt every 20k + a final ckpt at max_steps (entry forces final)
  num_workers: 8          # per DDP rank = 64 workers/node on 8-GPU p5.48xlarge
  init_from: null            # phase-1 starts from base_model weights
  exp_name: groot17_rc365_pretrain
  output_dir: ckpts/vla_base/groot17_pretrain   # LOCAL ONLY (gitignored)

eval: null                   # eval is a separate phase — see configs/eval/groot17_eval.yaml
