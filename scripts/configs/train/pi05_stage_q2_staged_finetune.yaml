# EXPERIMENT A7 — Q2 with the paper's STAGED recipe (steelman G6, the Q2-Q0 -3.7 gap).
#
# ATTEMPT 2 (2026-07-29). Attempt 1 DIVERGED: `Step 8200: grad_norm=nan, loss=nan, param_norm=nan,
# staged_phase1=1.0000` — i.e. inside phase 1, where the ONLY thing training is the robottt subtree,
# at phase1_lr_scale_robottt=10.0. It then ran 52k more NaN steps to "completion" and shipped an
# encoder with 19/19 non-finite robottt_fast tensors. Inner-GD stability at production dims was
# already known-delicate (the mean-normalized inner-loss fix, jul_23/00 §3 F2); a 10x LR on that
# subtree re-broke it. Attempt-2 recipe = the three changes below; everything else is unchanged, so
# A7 stays comparable to the sealed Q2.
#   1. phase1_lr_scale_robottt 10.0 -> 2.0 (the divergent knob; still a real phase-1 speed-up).
#   2. NaN fail-fast in the train loop (scripts/train.py::check_nonfinite_metrics): 3 consecutive
#      non-finite logged intervals => one-line diagnosis (which param group) + exit 1.
#   3. Staged canary no longer raises when num_train_steps <= phase1_steps; it clamps phase 1 to the
#      whole run, so a 1-step canary actually exercises the phase-1 masked step before submit.
# NO extra gradient clip was added: the existing optax.clip_by_global_norm(1.0) already IS a
# subtree-only clip during phase 1 — staged_mask_grads zeroes every non-subtree gradient BEFORE
# tx.update, so the global norm the clip sees is exactly the robottt subtree's norm. A second
# per-group clip would be redundant plumbing. (The post-optimizer LR scale is applied AFTER the
# clip, which is why the scale itself had to come down.)
#
# Hypothesis: the -3.7 is training-time damage, not a bad update rule at serve. The Jul-28 overnight
# serve ablations settled the mechanism: freezing W for the whole episode reproduces Q2 exactly
# (40.9 vs 41.0 on TOP8) and no reset/decay/eta knob moves beyond noise, i.e. the fast-weight path is
# behaviorally INERT at serve. What is left is the recipe: we co-train a FRESH random robottt subtree
# against the full backbone at one shared 2.5e-5 from step 0, while RoboTTT trains the TTT stage
# first (30K steps, backbone frozen) and only then post-trains everything.
#
# Delta vs pi05_stage_q_finetune.yaml: top-level staged: block + model.stage_q_arm: q2.
# Phase 1 (steps 0-14999): every parameter except the robottt_fast subtree is masked (grad AND
# update zeroed) and the subtree trains at 2x the shared LR schedule. Phase 2 (15000-59999): the
# standard full finetune resumes on the same schedule. ONE job, ONE checkpoint lineage, no re-init,
# no dataloader restart — the boundary is a traced compare on the step counter.
# Submit: finetune_pi_05_seq.py --fast-weights on --workspace off (Q2 only; staged requires the
# subtree to exist).
# Read: A7 > Q2 by >=2 pts => recipe, not architecture; then combine with the A6 loader for the
# honest Q2.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_q2_staged
  # Arm this recipe is valid for; the CLI flags must derive the same arm or the launch fails.
  stage_q_arm: q2
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  # RoboTTT fast-weight geometry (shared across arms; canary axes per 7a). token_dim d, fast_hidden h,
  # num_registers N=16 (paper), inner base LR 0.1 (App A.1), gate init 1e-3 (Eq 3).
  robottt:
    token_dim: 256
    fast_hidden: 128
    num_registers: 16
    base_inner_lr: 0.1
    gate_init: 0.001
    window_len: 8      # L: contiguous chunk-steps per training sequence
    tbptt_segment: 8   # G: gradient truncation segment (G>=L => full BPTT over the window)
    # native-frame spacing between chunk-steps. 8 = the serve replan stride, so one training
    # chunk-step == one serve-time commit and the fast-weight cadence matches train->eval
    # (stride 1 would commit 8x denser at train than serve — audit 2026-07-23).
    chunk_stride: 8

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  # Stage-Q batch_size counts WINDOWS (each L=8 chunk-steps): 8 windows -> effective per-step pi
  # batch 64, identical FLOPs/step and samples/step to the S0 recipe's batch 64.
  batch_size: 8
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_q2_staged
  output_dir: ckpts/vla_base/pi05_stage_q2_staged_finetune

# A7: the ONLY delta from the shared Stage-Q recipe. phase1_freeze: backbone == "everything except
# the robottt_fast subtree". Enforced per-step as a grad+update mask (NOT freeze_filter, which would
# bf16-cast the backbone and drop it from the optimizer state, making phase 2 impossible in-run).
# 15000 = 25% of the 60k budget, matching RoboTTT's 30k-of-~120k stage-1 fraction.
staged:
  phase1_steps: 15000
  phase1_freeze: backbone
  # Attempt 2: 10.0 diverged at step 8200 (see header). 2.0 keeps a phase-1 speed-up on the fresh
  # subtree while staying inside the inner-GD stability envelope; the clip that bounds it is the
  # shared optax.clip_by_global_norm(1.0), which during phase 1 sees ONLY this subtree's gradient.
  phase1_lr_scale_robottt: 2.0

eval: null
