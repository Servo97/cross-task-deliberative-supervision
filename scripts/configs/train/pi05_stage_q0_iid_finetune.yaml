# EXPERIMENT A6 — Q0 with i.i.d. window-step sampling (steelman G5, the Q0-S0 -7.3 recipe gap).
#
# Hypothesis: Q0's -7.3 vs S0 (48.5 vs 55.8) is batch CORRELATION, not the loss. With fast weights
# off the Stage-Q step is exactly the S0 per-step loss at batch B*L=64; the only difference is that
# those 64 samples are 8 episodes x 8 consecutive stride-8 steps (effective batch ~8 independent
# draws). This arm changes ONLY the correlation structure: the sampler support is byte-identical
# (same stride-8 alignment, same trailing-step drop, same <57-frame episode drop, same per-epoch
# sample counts) but the 64 steps of a batch are drawn i.i.d. across the whole soup.
#
# Delta vs pi05_stage_q_finetune.yaml: data.iid_window_steps: true + model.stage_q_arm: q0.
# Submit: finetune_pi_05_seq.py --fast-weights off --workspace off (Q0 only; the builder rejects
# iid + fast weights, since i.i.d. sampling breaks the fast-weight chain).
# Read: A6 ~= S0 => correlation was the whole recipe cost and every Q arm must be re-judged on this
# loader; still ~-4 => stride-8 support / episode-drop share the blame (add a stride-1 arm).

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_q0_iid
  # Arm this recipe is valid for; the CLI flags must derive the same arm or the launch fails.
  stage_q_arm: q0
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  # RoboTTT fast-weight geometry (shared across arms; canary axes per 7a). token_dim d, fast_hidden h,
  # num_registers N=16 (paper), inner base LR 0.1 (App A.1), gate init 1e-3 (Eq 3).
  robottt:
    token_dim: 256
    fast_hidden: 128
    num_registers: 16
    base_inner_lr: 0.1
    gate_init: 0.001
    window_len: 8      # L: contiguous chunk-steps per training sequence
    tbptt_segment: 8   # G: gradient truncation segment (G>=L => full BPTT over the window)
    # native-frame spacing between chunk-steps. 8 = the serve replan stride, so one training
    # chunk-step == one serve-time commit and the fast-weight cadence matches train->eval
    # (stride 1 would commit 8x denser at train than serve — audit 2026-07-23).
    chunk_stride: 8

data:
  # A6: the ONLY delta from the shared Stage-Q recipe. Same window enumeration (hence the exact same
  # samplable (episode, step) multiset), regrouped so each item's 8 steps are i.i.d. across the soup.
  iid_window_steps: true
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  # Stage-Q batch_size counts WINDOWS (each L=8 chunk-steps): 8 windows -> effective per-step pi
  # batch 64, identical FLOPs/step and samples/step to the S0 recipe's batch 64.
  batch_size: 8
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_q0_iid
  output_dir: ckpts/vla_base/pi05_stage_q0_iid_finetune

eval: null
