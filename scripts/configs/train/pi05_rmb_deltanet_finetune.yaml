# ReMemBench arm rmb-deltanet — the S1 gated-DeltaNet steering conditioner on the 13-task set.
#
# Recipe = pi05_stage_s1_deltanet_finetune.yaml (interface tanh; the module behind the wsm_tanh_cond
# subtree is swapped): a stateless gated delta-rule recurrence across the `cond_window` most recent
# omega latents, read out at the newest position and gated by the identical tanh(alpha) seam
# (alpha=1e-3, so step 0 is the base policy). Nothing carries across policy calls.
#
# cond_window: 8 raises the loader window from the S1 default of 1; _pi05_common exports it as
# WSM_K_WINDOW BEFORE the openpi imports (the dataloader freezes that variable at import) and fails
# loudly if the loader and the conditioner disagree. submit_pi_stage_s.py reads model.cond_window
# out of this file and seals it into the run manifest + WSM_K_WINDOW.
#
# SERVE AUTO-DETECT CONTRACT (unchanged from the RoboCasa deltanet arm): serve_pi_05_wsm_cfg peeks
# `pos_decay_bias` in the checkpoint params metadata; its leading axis IS cond_window, so a ckpt
# trained at 8 can never be served at 1.
#
# The ONLY differences from the RoboCasa s1-deltanet arm are the data substrate and the step
# schedule (see pi05_rmb_base_finetune.yaml).
#
# SUBMIT-TIME (not yaml fields): TARGET_DATA_S3 =
#   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/datasets/remembench_v02
# with target inventory artifact remembench_train13.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_rmb_deltanet
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  cond_type: gated_deltanet
  cond_window: 8
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: remembench13
  source: human
  split: target
  defer_image_resize_to_model_preprocess: false
  # NO subsample block: remembench13 trains on every demo.
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 500
  decay_steps: 25000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 15000
  # INERT on the Stage-S launch path: submit_pi_stage_s.py sets WSM_FINAL_ONLY_CHECKPOINTS=1
  # + WSM_SAVE_INTERVAL=max_steps, _pi05_common forces save_interval=max_steps under that
  # flag, and the entry refuses any retained step dir other than 14999. One checkpoint ships.
  save_interval: 2500
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_rmb_deltanet
  output_dir: ckpts/vla_base/pi05_rmb_deltanet_finetune

eval: null
