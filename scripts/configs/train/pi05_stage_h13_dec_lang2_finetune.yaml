# H13-R1 (arm key `h13_dec`) — LIVE keypatch decode through a workspace bottleneck.
#
# WHAT IS NEW. Every prior WSM arm consumed omega latents that a SEPARATE, FROZEN encoder had
# precomputed into a cache. R1 puts the encoder INSIDE this training graph: a 22M-parameter
# WorkspaceEncoder (v1's PatchPool + AdaLN-Zero stack, ported to flax-nnx) reads the pi0.5 SigLIP
# patch tokens that embed_prefix already computes, emits one 512-d w_t per sample, and a 192-way
# multi-hot BCE head decodes the NEXT KEYFRAME's salient patches out of that bottleneck. There is NO
# stop-gradient: the aux gradient flows back through w -> the patch tokens -> the whole backbone, and
# that gradient IS the mechanism under test.
#
#   loss = L_flow + 0.5 * BCE(dec(w_t), next-keyframe patches) + 0.05 * SIGReg(w_t)
#
# THE DISCRIMINATOR THIS ARM MUST BEAT. `pi05_stage_s3_salient_finetune.yaml` decoded the SAME sealed
# labels DIRECTLY off the action-expert penultimate and scored 54.9 — 0.9 BELOW the 55.8 base. R1's
# only novelty versus that run is routing the decode through the live 512-d w bottleneck plus SIGReg.
# So R1 must separate from 54.9, not merely from 55.8; a score near 54.9 says the bottleneck adds
# nothing and a score near 55.8 says the whole decode family is inert at post-train.
#
# LABELS. The pinned, in-use keypatch store — the identical artifact the salient arm consumed, read
# through the identical loader gate (WSM_SALIENT_TARGETS / WSM_SALIENT_LABELS_ROOT). It is NOT
# regenerated and must never be:
#   labels_s3   s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/wsm_labels
#   geometry    pi (vlm_episode_pi_*.npz only; the un-suffixed siblings are the GR00T geometry)
#   files       7500 = 50 tasks x 150 episodes, 100% coverage of the post-train keep-set
#   episode ids VERIFIED to match the seed-0 150_demos selection exactly (ids are sparse)
#
# NO OMEGA CACHE. This arm reads no precomputed features, so WSM_POLICY_FEATS_ROOT must be UNSET and
# the run manifest carries no encoder_id / feature-manifest block. That is a real difference from
# s1/s2/s3, not an omission.
#
# SERVE. Aux-only: sample_actions is byte-identical to S0, and wsm_enc/wsm_dec are dropped at load by
# BaseModel.load(remove_extra_params=True). Eval runs the vanilla stack on a stripped checkpoint
# (sealed protocol: 100 eps x 50 tasks, seed 20260723, exec/replan 8/8, envs_per_gpu 8,
# server_state_mode stateless_v1).
#
# Init, target50 T30 data, full-finetune surface, optimizer and 60k schedule are IDENTICAL to
# S0/S1/S2/S3 — one variable moves.

regime: vla_base
backbone: pi05
phase: target_finetune

model:
  config_name: pi05_robocasa_stage_h13_dec_lang2
  pi05: true
  max_token_len: 200
  ema_decay: 0.99
  freeze: none
  vision_lr_scale: 1.0
  augmentation_in_preprocess: true
  # --- H13 live/joint WSM ---
  h13: true
  h13_jepa: false
  h13_w_dim: 512          # v1's hard bottleneck: ONE token per step, 512 dims
  h13_enc_layers: 4       # v1 encoder shape (n_layers 4, n_heads 8, mlp_ratio 4.0)
  h13_enc_heads: 8
  # lambda_dec. The tree permits exactly ONE canary-time adjustment of this number, and only on the
  # flow-fraction reading (< 70% after warmup); any change must be recorded in h13_build_status.md.
  h13_dec_weight: 0.5
  # Same sample-count-invariant Epps-Pulley statistic and same budget as the s3 arm, so the aux is
  # O(1) at init. (The pre-2026-07-31 un-normalized port made 0.05 act as ~20 and collapsed s3.)
  h13_sigreg_weight: 0.05
  labels_s3: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/wsm_labels
  # --- R3b language decode: CROSS-ENTROPY over the caption vocabulary ---
  # Supersedes the R3/R4 InfoNCE-vs-frozen-embedding head, which collapsed to the caption centroid
  # (distinct captions have mean pairwise cosine 0.841, so predicting the mean nearly satisfied the
  # cosine term while InfoNCE never left chance) and cost ~5pp. CE cannot be satisfied that way:
  # predicting the mean gives you the class prior, not the label. Normalised by ln V so the term is
  # 1.0 at init and vocabulary-size invariant. Ids are the index into the sorted unique caption
  # vocabulary (V=8661), deterministic from the caption text alone.
  h13_lang_cls: true
  h13_lang_cls_weight: 0.5
  h13_lang_vocab: 8661
  caption_emb_s3: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/studies/long_context_v1/artifacts/captions/78b644501b37d2dc43ebbf8d818172bf6e0ac80b6f2586db78e4bd299794571f
  cameras:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand

data:
  soup: target50
  source: human
  split: target
  introduces_composite_unseen: true
  defer_image_resize_to_model_preprocess: false
  subsample:
    target_fraction: 0.30
  data_balancing:
    enabled: false

optim:
  lr: 2.5e-5
  lr_schedule: cosine
  warmup_steps: 1000
  decay_steps: 100000
  decay_lr: 2.5e-6
  dtype: bf16

train:
  batch_size: 64
  max_steps: 60000
  save_interval: 5000
  num_workers: 32
  init_from: s3://sagemaker-us-west-2-141701954645/sarvesh.patil/wsm_robocasa/pretrain150k/pi05/mg60_bal33/run/149999/params
  weight_loader: null
  exp_name: pi05_rc365_stage_h13_dec_lang2
  output_dir: ckpts/vla_base/pi05_stage_h13_dec_lang2_finetune

eval: null
