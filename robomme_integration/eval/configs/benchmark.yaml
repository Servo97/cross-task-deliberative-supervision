server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robomme:latest
  # Reserve GPU 0 for batched Pi inference; shard containers round-robin over the remaining H100s.
  gpus: "1,2,3,4,5,6,7"
  cpus: "0-191"
  env:
    - "NVIDIA_DRIVER_CAPABILITIES=all"
  volumes:
    - "/usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro"

output_dir: "./results"

benchmarks:
  - benchmark: "robomme_integration.eval.benchmark:RoboMMEOfficialHistoryBenchmark"
    subname: counting
    episodes_per_task: 50
    params:
      tasks: [BinFill, PickXtimes, SwingXtimes, StopCube]
      action_space: joint_angle
      max_steps: 1300
      dataset: test
      send_wrist_image: true
      send_state: true
      send_video_history: true

  - benchmark: "robomme_integration.eval.benchmark:RoboMMEOfficialHistoryBenchmark"
    subname: permanence
    episodes_per_task: 50
    params:
      tasks: [VideoUnmask, VideoUnmaskSwap, ButtonUnmask, ButtonUnmaskSwap]
      action_space: joint_angle
      max_steps: 1300
      dataset: test
      send_wrist_image: true
      send_state: true
      send_video_history: true

  - benchmark: "robomme_integration.eval.benchmark:RoboMMEOfficialHistoryBenchmark"
    subname: reference
    episodes_per_task: 50
    params:
      tasks: [PickHighlight, VideoRepick, VideoPlaceButton, VideoPlaceOrder]
      action_space: joint_angle
      max_steps: 1300
      dataset: test
      send_wrist_image: true
      send_state: true
      send_video_history: true

  - benchmark: "robomme_integration.eval.benchmark:RoboMMEOfficialHistoryBenchmark"
    subname: imitation
    episodes_per_task: 50
    params:
      tasks: [MoveCube, InsertPeg, PatternLock, RouteStick]
      action_space: joint_angle
      max_steps: 1300
      dataset: test
      send_wrist_image: true
      send_state: true
      send_video_history: true
