server:
  url: "ws://127.0.0.1:8000"
  # TPU checkpoint restore/first compilation can exceed the harness default of 30 seconds.
  timeout: 600

docker:
  image: "wsm/robomme-cpu-runtime:ubuntu22"
  cpus: "0-239"
  env:
    - "ROBOMME_USE_LAVAPIPE=1"
    - "LP_NUM_THREADS=4"
    - "OMP_NUM_THREADS=1"

output_dir: "./results/pickxtimes_canary"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robomme.benchmark:RoboMMEBenchmark"
    subname: counting-pickxtimes-canary
    episodes_per_task: 8
    max_steps: 50
    params:
      tasks: [PickXtimes]
      action_space: joint_angle
      dataset: test
      send_wrist_image: true
      send_state: true
      send_video_history: true
